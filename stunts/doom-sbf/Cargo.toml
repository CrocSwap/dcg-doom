[package]
name = "doom-sbf"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# This is intentionally a standalone program.  In particular, it must not be
# adopted by the root workspace or inherit chain/program's deploy profile.
[workspace]

[lib]
name = "doom_sbf"
crate-type = ["cdylib", "lib"]

# `static-write-probe` adds one mutable C global and the instruction that
# writes it.  It is OFF by default and must stay off for any image meant to
# load: the measurement it exists to make is that an image carrying writable
# static data is rejected by the loader.
[features]
default = []
static-write-probe = []
account-address-probe = []
# `zero-bss-probe` adds one mutable C global with NO initializer (a `.bss`
# cell) and the instruction that writes it, to test whether the "no writable
# static data" loader refusal M1006 measured with a nonzero `.data` cell also
# covers a zero-initialized `.bss` cell.
zero-bss-probe = []
# `ctx-engine` folds the 41-TU patch-0007 engine, its generated initializer,
# and the context-mode platform layer into the image, plus the DOOM-CX1
# instruction that writes and reads one context field through the
# compile-time constant DOOM_CTX (guarded).  Needs DOOM_SCRATCH pointing at
# the build.sh tree (doom-src at patches 0001-0007) at build time.
ctx-engine = []
# Adds bounded numeric phase markers to the SBF image. This is diagnostic
# instrumentation only: it changes the image identity and must never be used
# for a positive qualification claim.
diagnostic-profile = []
# The deployable DOOM-SIM/2 transport profile: E2R/5 + DOOM-STG/1 + SIM/2
# only (see transport_process_instruction).  Requires the engine.
sim-transport = ["ctx-engine"]
# The post-INIT bounded input-buffer extension operation.
capacity-extension = []
# Diagnostic-only v3 instruction used to measure clipped 40-column rendering.
# Never enable this feature in a deployable image.
render-clip-measurement = ["ctx-engine"]
# Diagnostic-only: run every BSP traversal, column and span setup and every
# per-pixel texture computation, but drop the framebuffer store.  The CU
# difference against a diagnostic-profile image is the pixel-write cost of the
# drawers.  The rendered pixels do not match the native oracle under this
# feature.  Never enable it in a deployable image.
render-count-only = ["ctx-engine"]
# Reproduce the fixed 5,120-slot SIM2INPT/2 profile and its captured DEMO1
# end marker. New images use the capacity-bound SIM2INPT/3 profile.
legacy-5120-buffer = []
# Stop sweeps on the compute meter (`sol_remaining_compute_units`).  NOT
# deployable on Fogo, which does not activate that syscall; for ProgramTest
# and runtimes that do.  The default transport profile is count-capped.
metered-sweep = ["sim-transport"]

[dependencies]
solana-program = "=2.3.0"
sha2 = { version = "=0.10.9", default-features = false, features = ["compress"] }
# These constraints keep the SBF build on the graph supported by platform-tools
# v1.51 (Cargo 1.84).
indexmap = "=2.13.0"
blake3 = "=1.8.2"
proc-macro-crate = "=3.3.0"
zeroize = "=1.8.1"

[build-dependencies]
cc = "=1.2.58"
sha2 = { version = "=0.10.9", default-features = false, features = ["compress"] }

[profile.release]
overflow-checks = false
lto = true
codegen-units = 1
