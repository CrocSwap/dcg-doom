[package]
name = "doom-sbf-driver"
version = "0.1.0"
edition = "2021"
publish = false

# A separately invocable ProgramTest runner, not a member of any repository
# workspace.  It loads the compiled SBF image; it never supplies a native
# processor to ProgramTest.
[workspace]

# `static_probe` measures what the loader does with an image that carries
# writable static data, so it only builds when the crate feature that puts
# such data in the image is on.
[features]
static-write-probe = ["doom-sbf/static-write-probe"]
# `zero_bss_probe` measures whether the loader's writable-static-data refusal
# also covers a zero-initialized (.bss) cell, not just a nonzero (.data) one.
zero-bss-probe = ["doom-sbf/zero-bss-probe"]
# `ctx-engine` runs DOOM-CX1 against the engine image: guarded context
# write/read plus the moved-position refusal control.
ctx-engine = ["doom-sbf/ctx-engine"]
ex2-sbf = ["doom-sbf/ctx-engine"]
# DOOM-SIM/2 gates: the driver encodes E2R/5 requests, so it must see the
# same transport-profile constants as the image under test.
sim-transport = ["ctx-engine", "doom-sbf/sim-transport"]

[[bin]]
name = "static_probe"
required-features = ["static-write-probe"]

[[bin]]
name = "zero_bss_probe"
required-features = ["zero-bss-probe"]

[[bin]]
name = "ctx_probe"
required-features = ["ctx-engine"]

[[bin]]
name = "ex2_sbf"
required-features = ["ex2-sbf"]

[[bin]]
name = "resource_native"
required-features = ["ctx-engine"]

[[bin]]
name = "resource_ri2_sbf"
required-features = ["ctx-engine"]

[[bin]]
name = "continuation_sbf"
required-features = ["ctx-engine"]

[[bin]]
name = "continuation_split_sbf"
required-features = ["ctx-engine"]

[[bin]]
name = "simulation_gate"
required-features = ["ctx-engine"]

[[bin]]
name = "sweep_native"
required-features = ["ctx-engine"]

[[bin]]
name = "fresh_resume_probe"
required-features = ["ctx-engine"]

[[bin]]
name = "sweep_gate"
# The host gate uses ctx-engine helpers to prepare and inspect accounts.  It
# loads the separately built SBF sim-transport image, so enabling that
# dependency feature in the host process would violate build.rs' pinned
# ctx-engine-only host provenance profile.
required-features = ["ctx-engine"]

[[bin]]
name = "sim1_profile"
required-features = ["ctx-engine"]

[[bin]]
name = "headless"

[dependencies]
doom-sbf = { path = ".." }
bincode = "=1.3.3"
solana-program-test = "=2.3.9"
solana-program = "=2.3.0"
base64 = "=0.22.1"
solana-account = "=2.2.1"
solana-compute-budget-interface = "=2.2.2"
solana-hash = "=2.3.0"
solana-instruction = "=2.3.3"
solana-keypair = "=2.2.3"
solana-message = "=2.4.0"
solana-pubkey = "=2.4.0"
solana-signer = "=2.2.1"
solana-system-interface = "=1.0.0"
solana-transaction = "=2.2.3"
solana-transaction-error = "=2.2.1"
solana-banks-client = "=2.3.9"
solana-banks-interface = "=2.3.9"
sha2 = "=0.10.9"
serde_json = "=1.0.151"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
