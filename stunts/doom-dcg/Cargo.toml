[package]
name = "doom-dcg"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
sbf = ["dep:doom-sbf", "doom-sbf/sim-transport", "doom-sbf/no-entrypoint", "doom-sbf/dcg-stateful-v3"]
sbf-programtest = []

[dependencies]
dcg-program = { git = "file:///Users/colkitt/sith/toys/crypto/durable-compute-graph", rev = "e4752c8bb24ac9830cb50695eb0d411236dafc16", package = "dcg-program", default-features = false, features = ["no-entrypoint", "revision-8"] }
doom-sbf = { path = "../doom-sbf", default-features = false, optional = true }
solana-program = "=2.3.0"

[patch.crates-io]
curve25519-dalek = { git = "file:///Users/colkitt/sith/toys/crypto/durable-compute-graph", rev = "e4752c8bb24ac9830cb50695eb0d411236dafc16", package = "curve25519-dalek" }

[dev-dependencies]
bincode = "=1.3.3"
solana-account = "=2.2.1"
solana-compute-budget-interface = "=2.2.2"
solana-instruction = "=2.3.3"
solana-keypair = "=2.2.3"
solana-message = "=2.4.0"
solana-program-test = "=2.3.9"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.3"
solana-transaction-error = "=2.2.1"
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }

[profile.fasttest]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
